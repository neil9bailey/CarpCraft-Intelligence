name: Android Release APK

# Builds a release-signed APK you can sideload onto an Android tablet for live
# testing. Run it manually ("Run workflow") to get a downloadable artifact, or
# push a tag like v0.1.0 to also publish a GitHub Release with the APK attached.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Optional repository variables:
#   CARPCRAFT_API_BASE_URL    backend base URL the app should call (e.g. Azure URL)
#   CARPCRAFT_USER_ID         dev user id header for local-auth backends
# Optional secret:
#   GOOGLE_MAPS_API_KEY       Android Maps SDK key (hybrid imagery)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Override backend base URL for this build"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/carpcraft_app
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release keystore secrets before running this workflow."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Resolve backend base URL
        id: api
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.CARPCRAFT_API_BASE_URL }}"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=CARPCRAFT_API_BASE_URL=${{ steps.api.outputs.url }} \
            --dart-define=CARPCRAFT_USER_ID=${{ vars.CARPCRAFT_USER_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carpcraft-intelligence-release-apk
          path: mobile/carpcraft_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/carpcraft_app/build/app/outputs/flutter-apk/app-release.apk
